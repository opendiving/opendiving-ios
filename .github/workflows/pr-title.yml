name: PR Title

on:
  pull_request:
    # `edited` is the one that matters: it re-runs the check when a title is
    # corrected, so a failing PR goes green without an empty commit to push.
    #
    # `synchronize` is not about the title at all - it is what lets this be a
    # required check. A required check has to have passed on the PR's *latest*
    # head SHA, so without a run per push, a PR that gains a second commit
    # would sit at "Expected - waiting for status" for good. The title is read
    # from the event payload rather than from the tree, so the extra runs
    # reach the same verdict. Which checks `main` requires is the repository's
    # rulesets' to say, not this file's.
    types: [opened, edited, reopened, synchronize]

# The one list of types. CONTRIBUTING.md spells the same list out in prose -
# keep the two in step.
env:
  TYPES: feat|fix|refactor|docs|test|chore|perf|ci|build|revert

jobs:
  semantic-title:
    runs-on: ubuntu-latest

    # Nothing is checked out and no API call is made - the title arrives in the
    # event payload - so this job needs no token at all.
    permissions: {}

    steps:
      # PRs here are squash-merged, so this title becomes the commit subject on
      # `main`. It is the only part of a branch that outlives the branch, which
      # is why it is checked and the individual commits are not.
      #
      # The title is passed through `env` rather than interpolated into the
      # script. `${{ github.event.pull_request.title }}` written inside `run:`
      # is substituted before bash parses the line, so a title containing
      # backticks or `$(...)` would execute as shell.
      - name: Check title is a conventional commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^($TYPES)(\([a-z0-9._-]+\))?!?: .+"

          if printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "OK: $TITLE"
            exit 0
          fi

          echo "PR title is not a semantic commit subject:"
          echo "    $TITLE"
          echo
          echo "Expected: <type>[(scope)][!]: <description>"
          echo "Types:    ${TYPES//|/, }"
          echo
          echo "Examples: feat: the dive list and the dive detail"
          echo "          fix(kit): decode a dive with no recordings"
          echo "          feat!: raise the deployment floor to iOS 19"
          echo
          echo "Edit the title - this check re-runs on edit, no push needed."
          exit 1
