name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The merge queue tests each entry squashed onto `main` under this event, and a required
  # check that never reports there holds the entry until the queue times it out.
  merge_group:

# A new push to a PR cancels the run still going for the previous one: the macOS job is
# the expensive one, and only the newest head's result can count. Runs on `main` and for
# the merge queue are never cancelled: every commit on `main` keeps its own result, and
# no queue entry waits on a run that stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository. `persist-credentials: false` keeps the token out of
# `.git/config` in a workspace that then builds and runs this repository's code.
permissions:
  contents: read

jobs:
  # The Kit on Linux, which is what keeps it free of UIKit, SwiftUI and Security, and the
  # format lint. The container pins the toolchain to the patch release the maintainers'
  # Xcode ships, so the formatter here is the one `swift format` runs locally; see
  # DECISIONS.md, "CI pins the Linux toolchain to a patch release".
  kit-linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint formatting
        run: swift format lint --strict --recursive .

      - name: Test the Kit
        run: swift test --package-path Packages/OpenDivingKit

  # The documents the Kit's archive writer must reproduce byte for byte, validated by the
  # DiveJSON reference validator at the release opendiving-api pins, so a golden the format
  # rejects fails the build rather than an import.
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install the validator
        run: pip install divejson==0.35.0

      - name: Validate the goldens
        run: divejson validate Packages/OpenDivingKit/Tests/OpenDivingKitTests/Fixtures/DiveComputers/*.divejson

  # The dive reader and libdc-swift name one libdivecomputer commit: the app links the reader
  # against libdc-swift's copy, so the two pins in project.yml move together.
  libdivecomputer-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the libdivecomputer commits
        run: scripts/libdivecomputer-pins.sh

  # The app and both test bundles, on a simulator. The image and the Xcode on it are named
  # rather than left to defaults; see DECISIONS.md, "CI builds the app on macos-15 with
  # Xcode 26.3". The project has to build under the maintainers' newer Xcode as well, which
  # is checked locally.
  app-macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Show the toolchain
        run: xcodebuild -version

      # The package checkouts and MapLibre's binary, so a run needs nothing from GitHub's
      # release downloads, which have failed this job before the code compiled. A restored
      # SourcePackages resolves offline even without a Package.resolved, which the generated
      # project only gains by resolving — so the manifests that name the pins are the key, and
      # an older entry seeds a run whose pins moved.
      - name: Restore the packages
        id: packages
        uses: actions/cache/restore@v6
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/OpenDivingKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve the packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenDiving.xcodeproj \
            -scheme OpenDiving \
            -derivedDataPath .build

      # Saved once resolved rather than at the end, so a failing test still leaves the cache.
      - name: Save the packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      # A fresh simulator's first boot takes about two minutes. Started here, it finishes while
      # the app compiles rather than after; any earlier and its disk writes slow the restore.
      - name: Boot the simulator
        run: |
          udid=$(scripts/simulator.sh)
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # No index store: nothing reads one on a runner, and writing it slows every compile.
      - name: Build and test
        run: |
          xcodebuild test \
            -project OpenDiving.xcodeproj \
            -scheme OpenDiving \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath .build \
            COMPILER_INDEX_STORE_ENABLE=NO
