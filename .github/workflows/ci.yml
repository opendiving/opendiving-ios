name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a PR cancels the run still going for the previous one: the macOS job is
# the expensive one, and only the newest head's result can count. Runs on `main` are
# never cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository. `persist-credentials: false` keeps the token out of
# `.git/config` in a workspace that then builds and runs this repository's code.
permissions:
  contents: read

jobs:
  # The Kit on Linux, which is what keeps it free of UIKit, SwiftUI and Security, and the
  # format lint. The container pins the toolchain to the patch release the maintainers'
  # Xcode ships, so the formatter here is the one `swift format` runs locally; see
  # DECISIONS.md, "CI pins the Linux toolchain to a patch release".
  kit-linux:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint formatting
        run: swift format lint --strict --recursive .

      - name: Test the Kit
        run: swift test --package-path Packages/OpenDivingKit

  # The documents the Kit's archive writer must reproduce byte for byte, validated by the
  # DiveJSON reference validator at the release opendiving-api pins, so a golden the format
  # rejects fails the build rather than an import.
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install the validator
        run: pip install divejson==0.35.0

      - name: Validate the goldens
        run: divejson validate Packages/OpenDivingKit/Tests/OpenDivingKitTests/Fixtures/DiveComputers/*.divejson

  # The app and both test bundles, on a simulator. The image and the Xcode on it are named
  # rather than left to defaults; see DECISIONS.md, "CI builds the app on macos-15 with
  # Xcode 26.3". The project has to build under the maintainers' newer Xcode as well, which
  # is checked locally.
  app-macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Show the toolchain
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project OpenDiving.xcodeproj \
            -scheme OpenDiving \
            -destination "id=$(scripts/simulator.sh)" \
            -derivedDataPath .build
