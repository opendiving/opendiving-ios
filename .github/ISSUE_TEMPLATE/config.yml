blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/opendiving/opendiving-ios/security/advisories/new
    about: Report it privately. That opens an advisory only the maintainers can see; please do not open a public issue for something exploitable. No GitHub account? security@opendiving.app.
  - name: Question, idea, or show and tell
    url: https://github.com/opendiving/opendiving/discussions
    about: Discussions live in the opendiving/opendiving repository and cover the whole project, this app included.
  - name: This is really an API bug
    url: https://github.com/opendiving/opendiving-api/issues/new/choose
    about: Sign-in, stored data and imports live in opendiving-api. Not sure which side it is on? File it here and it will be moved.
  - name: Something in the web app
    url: https://github.com/opendiving/opendiving-web/issues/new/choose
    about: Anything you saw in a browser belongs in the web app's repository.
