# The source of truth for OpenDiving.xcodeproj, which is generated and never tracked:
# run `xcodegen generate` after a checkout and after editing this file. Sources are
# synchronized folders, so adding a Swift file needs neither an edit here nor a regenerate.
name: OpenDiving

options:
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "18.0"

packages:
  OpenDivingKit:
    path: Packages/OpenDivingKit
  LibDCSwift:
    url: https://github.com/deepsealabs/libdc-swift
    exactVersion: 1.18.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenDiving:
    type: application
    platform: iOS
    sources:
      - path: OpenDiving/Sources
        type: syncedFolder
    dependencies:
      - package: OpenDivingKit
      - package: LibDCSwift
        product: LibDCSwift
    # Carries the bundle identifier and the optional, gitignored signing file. See
    # CONTRIBUTING.md, "Running on your iPhone".
    configFiles:
      Debug: Config/OpenDiving.xcconfig
      Release: Config/OpenDiving.xcconfig
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: OpenDiving/Info.plist
      properties:
        CFBundleDisplayName: OpenDiving
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          OpenDiving connects to the server you choose, which can be one on your local network.
        NSLocationWhenInUseUsageDescription: >-
          OpenDiving uses your location only when you ask it to place a new dive site where you
          are.
        NSBluetoothAlwaysUsageDescription: >-
          OpenDiving connects to your dive computer over Bluetooth to download your dives, and
          for nothing else.
        # A download in progress keeps going while the phone is locked.
        UIBackgroundModes:
          - bluetooth-central
        # Every format the server reads can be shared to the app. Imported, never exported:
        # the project owns none of these formats. Ranked Alternate, so a format's own app
        # stays first. Copied into Documents/Inbox rather than opened in place. See
        # DECISIONS.md, "Shared files are imported types, copied in".
        LSSupportsOpeningDocumentsInPlace: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.opendiving.fit
            UTTypeDescription: FIT activity file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
          - UTTypeIdentifier: app.opendiving.uddf
            UTTypeDescription: UDDF dive log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [uddf]
          - UTTypeIdentifier: app.opendiving.ssrf
            UTTypeDescription: Subsurface dive log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ssrf]
          - UTTypeIdentifier: app.opendiving.divejson
            UTTypeDescription: DiveJSON dive log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [divejson]
        CFBundleDocumentTypes:
          - CFBundleTypeName: FIT activity file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.fit]
          - CFBundleTypeName: UDDF dive log
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.uddf]
          - CFBundleTypeName: Subsurface dive log
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.ssrf]
          - CFBundleTypeName: DiveJSON dive log
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.divejson]
          - CFBundleTypeName: JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
          - CFBundleTypeName: XML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.xml]
          - CFBundleTypeName: Zip archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]

  OpenDivingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenDivingTests
        type: syncedFolder
    dependencies:
      - target: OpenDiving
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.opendiving.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  OpenDiving:
    build:
      targets:
        OpenDiving: all
    test:
      gatherCoverageData: false
      targets:
        - OpenDivingTests
        - package: OpenDivingKit/OpenDivingKitTests
