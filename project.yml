# The source of truth for OpenDiving.xcodeproj, which is generated and never tracked:
# run `xcodegen generate` after a checkout and after editing this file. Sources are
# synchronized folders, so adding a Swift file needs neither an edit here nor a regenerate.
name: OpenDiving

options:
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "18.0"

packages:
  OpenDivingKit:
    path: Packages/OpenDivingKit
  # The two pins move together: the reader links against libdc-swift's libdivecomputer, and
  # its release names the libdivecomputer commit it was built for. See CONTRIBUTING.md.
  LibDCSwift:
    url: https://github.com/deepsealabs/libdc-swift
    exactVersion: 1.20.0
  LibDiveJSON:
    url: https://github.com/divejson/divejson-c
    exactVersion: 0.1.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenDiving:
    type: application
    platform: iOS
    sources:
      - path: OpenDiving/Sources
        type: syncedFolder
    dependencies:
      - package: OpenDivingKit
      - package: LibDCSwift
        product: LibDCSwift
      - package: LibDiveJSON
        product: LibDiveJSON
      - package: MapLibre
        product: MapLibre
    # Carries the bundle identifier and the optional, gitignored signing file. See
    # CONTRIBUTING.md, "Running on your iPhone".
    configFiles:
      Debug: Config/OpenDiving.xcconfig
      Release: Config/OpenDiving.xcconfig
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # `@_extern(c)`, for the two Shearwater transfers libdivecomputer keeps internal; see
        # Device/ShearwaterCommon.swift.
        OTHER_SWIFT_FLAGS: -enable-experimental-feature Extern
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # The Kit's `Icon` names the symbols; Xcode's generated `ImageResource` names would
        # make `Image(.fish)` ambiguous.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: OpenDiving/Info.plist
      properties:
        CFBundleDisplayName: OpenDiving
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The splash's coral, so the system's launch screen hands over to it without a flash. The
        # launch screen paints a colour's sRGB components as Display P3, so the asset holds
        # #FF7F50's P3 components, written as sRGB, and serves nothing else.
        UILaunchScreen:
          UIColorName: LaunchCoral
        # Without it an iPhone holds what the app moves itself, the finder's panel following a
        # finger and its spring, to 60 Hz on a 120 Hz screen, where the system's sheets run at 120.
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          OpenDiving connects to the server you choose, which can be one on your local network.
        NSLocationWhenInUseUsageDescription: >-
          OpenDiving uses your location to open the dive-site finder near you, and when you ask it
          to place a dive site or a trip where you are.
        NSBluetoothAlwaysUsageDescription: >-
          OpenDiving connects to your dive computer over Bluetooth to download your dives, and
          for nothing else.
        # A download in progress keeps going while the phone is locked.
        UIBackgroundModes:
          - bluetooth-central
        # Every format the server reads can be shared to the app. Imported, never exported:
        # the project owns none of these formats. Ranked Alternate, so a format's own app
        # stays first. Copied into Documents/Inbox rather than opened in place. See
        # DECISIONS.md, "Shared files are imported types, copied in".
        LSSupportsOpeningDocumentsInPlace: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.opendiving.fit
            UTTypeDescription: FIT activity file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
          - UTTypeIdentifier: app.opendiving.uddf
            UTTypeDescription: UDDF dive log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [uddf]
          - UTTypeIdentifier: app.opendiving.ssrf
            UTTypeDescription: Subsurface dive log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ssrf]
          - UTTypeIdentifier: app.opendiving.divejson
            UTTypeDescription: DiveJSON dive log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [divejson]
          - UTTypeIdentifier: app.opendiving.shearwater-db
            UTTypeDescription: Shearwater Cloud database
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [db]
        CFBundleDocumentTypes:
          - CFBundleTypeName: FIT activity file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.fit]
          - CFBundleTypeName: UDDF dive log
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.uddf]
          - CFBundleTypeName: Subsurface dive log
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.ssrf]
          - CFBundleTypeName: DiveJSON dive log
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.divejson]
          - CFBundleTypeName: Shearwater Cloud database
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.opendiving.shearwater-db]
          - CFBundleTypeName: JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
          - CFBundleTypeName: XML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.xml]
          - CFBundleTypeName: Zip archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]

  OpenDivingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenDivingTests
        type: syncedFolder
    dependencies:
      - target: OpenDiving
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.opendiving.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  OpenDiving:
    build:
      targets:
        OpenDiving: all
    test:
      gatherCoverageData: false
      # The Kit's tests run under `swift test`: in this scheme they would compile beside the app
      # in every simulator run, since Xcode 26's `-only-testing` still builds them.
      targets:
        - OpenDivingTests
